<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k8oui · Operators</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23326ce5'/%3E%3Cpath d='M16 6l8.7 5v10L16 26l-8.7-5V11z' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 6l8.7 5v10L16 26l-8.7-5V11z" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="3" fill="#fff"/></svg><span>k8oui</span><small>Operators</small></div>
  <div class="spacer"></div>
  <span id="mode" class="pill"></span>
  <label class="sr" for="ctx">Kubernetes context</label>
  <select id="ctx" title="Kubernetes context"></select>
  <label class="check"><input type="checkbox" id="auto" checked> Auto-refresh</label>
  <button id="add" class="btn primary">+ Add operator</button>
  <button id="refresh" class="btn" title="Refresh now">↻ Refresh</button>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section id="summary" class="tiles" aria-label="Summary"></section>

  <div class="bar">
    <div class="tabs" role="tablist" id="views">
      <button role="tab" data-view="operators">Operators</button>
      <button role="tab" data-view="topology">Topology</button>
    </div>
    <div class="spacer"></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    <input id="search" type="search" placeholder="Search operators, kinds…  ( / )" autocomplete="off">
  </div>

  <section id="content" aria-live="polite"></section>
</main>

<aside id="drawer" class="drawer" hidden aria-label="Operator details">
  <div id="drawer-body"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
